name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            make_target: build-linux
          - goos: linux
            goarch: arm64
            make_target: build-linux-arm64
          - goos: freebsd
            goarch: amd64
            make_target: build-freebsd
          - goos: freebsd
            goarch: arm64
            make_target: build-freebsd-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          REPO_BASE: https://github.com/${{ github.repository }}/releases
        run: |
          # Ensure REPO_BASE is lowercase (GitHub releases URLs are case-insensitive,
          # but keep it consistent with GHCR image names).
          REPO_BASE="${REPO_BASE,,}"
          export REPO_BASE
          make ${{ matrix.make_target }}

      - name: Pack release archive
        run: |
          set -euo pipefail
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          NODE_BIN="fboard-node-${GOOS}-${GOARCH}"
          CLI_BIN="fbctl-${GOOS}-${GOARCH}"
          ARCHIVE="fboard-node-${GOOS}-${GOARCH}.tar.gz"
          STAGE="$(mktemp -d)"
          install -m 755 "$NODE_BIN" "$STAGE/fboard-node"
          install -m 755 "$CLI_BIN" "$STAGE/fbctl"
          tar -C "$STAGE" -czf "$ARCHIVE" fboard-node fbctl
          rm -rf "$STAGE"
          ls -lh "$ARCHIVE"
          tar -tzf "$ARCHIVE"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: fboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: fboard-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: |
            dist/fboard-node-linux-amd64.tar.gz
            dist/fboard-node-linux-arm64.tar.gz
            dist/fboard-node-freebsd-amd64.tar.gz
            dist/fboard-node-freebsd-arm64.tar.gz
